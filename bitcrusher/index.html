<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bitcrusher Studio - Skyeto</title>
    
    <!-- PWA Setup & App Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bitcrusher">
    
    <!-- App Icon khi thêm ra màn hình chính (iOS & Android) -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    
    <!-- BRAND HEADER -->
    <div class="header-wrap">
        <div class="title-bg">BITCRUSHER</div>
        <div class="title-fg">STUDIO V3.6</div>
    </div>
    <div class="status-message" id="fileBadge">NO AUDIO FILE SELECTED</div>

    <!-- FILE UPLOAD CARD -->
    <div class="card file-upload-card">
        <input type="file" id="fileInput" accept="audio/*, .mp3, .wav, .m4a, .aac, .ogg, .flac" hidden>
        <button class="btn btn-file" id="selectFileBtn">
            <span>🎵</span> IMPORT AUDIO FILE
        </button>
    </div>

    <!-- WAVEFORM / SPECTROGRAM CANVAS -->
    <div class="card">
        <div class="canvas-container">
            <canvas id="spectrogram"></canvas>
        </div>
    </div>

    <!-- TRACK SCRUBBER CONTROL -->
    <div class="card">
        <div class="control-item">
            <div class="control-header">
                <span>DURATION / SEEK</span>
                <span id="timeDisplay" class="control-value">0:00 / 0:00</span>
            </div>
            <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1" disabled>
        </div>
    </div>

    <!-- BITCRUSHER PARAMETERS -->
    <div class="card">
        <div class="control-item">
            <div class="control-header">
                <span>BIT DEPTH</span>
                <span id="bitVal" class="control-value">8 bits</span>
            </div>
            <input type="range" id="bitDepth" min="1" max="16" value="8" step="1">
        </div>

        <div class="control-item">
            <div class="control-header">
                <span>DOWNSAMPLE</span>
                <span id="sampleVal" class="control-value">4x</span>
            </div>
            <input type="range" id="downsample" min="1" max="32" value="4" step="1">
        </div>

        <div class="control-item">
            <div class="control-header">
                <span>DRY / WET MIX</span>
                <span id="mixVal" class="control-value">100%</span>
            </div>
            <input type="range" id="mix" min="0" max="100" value="100" step="1">
        </div>
    </div>

    <!-- PLAYBACK BUTTON -->
    <div style="margin-bottom: 14px;">
        <button id="playBtn" class="btn btn-primary">
            <span>▶</span> PLAY AUDIO
        </button>
    </div>

    <!-- NATIVE EXPORT -->
    <div class="card">
        <div class="control-header" style="margin-bottom: 8px;">
            <span>EXPORT AUDIO</span>
        </div>
        <button id="exportWav" class="btn btn-outline">💾 DOWNLOAD WAV FILE</button>
    </div>

    <footer>
        STELLAN SKYETO NEXUS © 2026 - BITCRUSHER WEB APP
    </footer>
</div>

<script src="script.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
